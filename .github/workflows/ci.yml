name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Self-tests
        run: make test

      - name: Interaction benchmarks
        run: make bench

      - name: Interaction matrix
        run: make matrix

      - name: Bundle app
        run: ./scripts/bundle.sh
